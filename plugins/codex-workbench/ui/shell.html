<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex 工作台</title><!--STYLE--></head><body>
<div id="page-scroll" role="region" aria-label="工作台页面" tabindex="0">
<aside><div class="logo"><!--ICON--><span>工作台</span></div><div class="nav-label">项目</div><nav id="projects" aria-label="按项目浏览"></nav><div class="sidebar-footer">本地只读 · v0.9.0<br>按最近会话更新排列</div></aside>
<main><header><div class="header-title"><h1 id="heading">全部项目</h1><div class="header-meta"><span id="stats"></span><span id="sync" role="status">正在连接 Codex…</span></div></div><button class="quiet" id="refresh" disabled title="重新读取记录与已有摘要，不自动调用模型">刷新数据</button></header>
<details id="versionHelp"><summary>版本与连接</summary><label for="language">Language / 语言</label> <select id="language" aria-label="Language / 语言"><option value="auto">自动 / Auto</option><option value="zh-CN">简体中文</option><option value="en">English</option></select><p id="versionStatus">正在检查运行版本…</p><button class="quiet" id="checkVersion">检查界面与服务版本</button><p class="muted">刷新数据不会升级界面。更新后请关闭并重新打开工作台；版本未变化时，完全退出 Codex（⌘Q）后重启。</p><p id="scope" class="muted">仅读取当前设备；不含归档和子代理会话。</p></details>
<div id="versionWarning" role="status"></div><p id="message" role="alert"></p><section id="onboarding" hidden aria-label="首次体验"></section><section id="overview" aria-label="项目概况"></section>
<section id="reading-workspace" aria-label="会话浏览区"><div class="tools"><button class="back-button" id="backToList" hidden>‹ 返回会话列表</button><select id="mobileProject" aria-label="选择项目"></select><input id="query" type="search" aria-label="搜索会话" placeholder="搜索会话、目标或关键词" autocomplete="off" title="搜索标题、项目名、初始需求与已有摘要，不搜索文件正文"><select id="order" aria-label="时间排序"><option value="new">最近更新</option><option value="old">最早更新</option></select></div>
<div class="content"><section id="session-list-pane" aria-label="会话列表" tabindex="0"><div class="list-caption"><span id="resultCount" role="status"></span></div><div id="sessions"></div><button class="quiet" id="more" hidden>加载更多</button></section>
<section id="detail" aria-label="会话详情" tabindex="0"><div id="detailHeader"></div><p id="detailMessage" role="alert"></p><div id="taskOverview"></div><div id="files"></div><details id="rawReply"><summary>查看最近原始回复与来源</summary><p id="rawMeta" class="muted"></p><p id="rawText"></p></details></section></div>
<footer>本地真实数据 · 摘要需明确同意后生成</footer></section>
</main></div><!--SCRIPT--></body></html>
