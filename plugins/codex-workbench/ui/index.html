function groupFiles(files){
 const folders=new Map();for(const [index,file] of files.entries()){
  const slash=file.path.lastIndexOf('/'),directory=file.path.slice(0,slash)||'/',name=file.name||file.path.slice(slash+1),stem=name.replace(/(?:\.draw\.io|\.[^.]+)$/i,'')||name;
  if(!folders.has(directory))folders.set(directory,{directory,items:new Map()});const folder=folders.get(directory);
  if(!folder.items.has(stem))folder.items.set(stem,{name:stem,index,files:[]});folder.items.get(stem).files.push({file,index});
 }
 const result=[...folders.values()];const common=result.map(f=>f.directory.split('/'));let prefix=0;while(common.length&&common.every(parts=>parts[prefix]!==undefined&&parts[prefix]===common[0][prefix]))prefix++;
 return result.map(folder=>({...folder,title:folder.directory.split('/').slice(prefix).join('/')||folder.directory.split('/').pop()||tr('根目录'),items:[...folder.items.values()]}));
}
function formatLabel(file){const ext=file.name.match(/(?:\.draw\.io|\.[^.]+)$/i)?.[0].toLowerCase();return ({'.html':tr('HTML 网页'),'.htm':tr('HTML 网页'),'.drawio':tr('draw.io 图稿'),'.draw.io':tr('draw.io 图稿'),'.svg':tr('SVG 矢量图'),'.png':tr('PNG 图片'),'.jpg':tr('JPG 图片'),'.jpeg':tr('JPG 图片'),'.webp':tr('WebP 图片'),'.md':tr('MD 文档'),'.pdf':tr('PDF 文档'),'.docx':tr('Word 文档'),'.xlsx':tr('Excel 表格'),'.xls':tr('Excel 表格'),'.pptx':tr('PPT 演示稿'),'.csv':tr('CSV 表格'),'.tsv':tr('TSV 表格'),'.txt':tr('TXT 文本'),'.tex':tr('LaTeX 文稿'),'.excalidraw':tr('Excalidraw 图稿')})[ext]||ext?.slice(1).toUpperCase()||tr('文件');}
function filesHtml(id){
 const r=fileCache.get(id),heading=tr('<h3>产出文件</h3>')+(r?tr('<p class="muted">根据文件变更和历史脚本写入分析识别产出；仅阅读或引用不计入，无法解析的产物可能遗漏。</p>'):'');if(!r)return heading+tr('<p class="muted">正在读取文件记录…</p>');if(r.error&&!r.files)return heading+'<p>'+escapeHtml(r.error)+'</p>';if(!r.files.length)return heading+tr('<p class="muted">暂无可识别的产出文件</p>');
 const groups=groupFiles(r.files);
 return tr('<section class="file-list" aria-label="会话产出文件">')+heading+(r.error?'<p class="muted" role="status">'+escapeHtml(r.error)+tr(' · 已保留上次列表</p>'):'')+'<p class="file-list-hint">'+r.files.length+tr(' 个文件 · ')+groups.length+tr(' 个目录 · 同名格式并排，点击格式预览</p>')+groups.map(folder=>'<section class="file-folder" aria-label="'+escapeHtml(folder.title)+'"><h4 title="'+escapeHtml(folder.directory)+'">'+escapeHtml(folder.title)+'</h4>'+folder.items.map(item=>{
  const annotated=item.files.find(x=>x.file.label),label=annotated?.file.label,key=id+'|'+item.files[0].file.path;
  const variants=item.files.map(({file:f,index:i})=>{const canPreview=f.exists&&f.previewKind&&(f.previewKind!=='native'||canOpenFiles);return canPreview?'<button class="file-format" id="previewFile'+i+'" data-file-path="'+escapeHtml(f.path)+tr('" aria-label="在标签页预览 ')+escapeHtml(f.name)+'" title="'+escapeHtml(f.name)+tr(' · 在 Codex 标签页预览">')+escapeHtml(formatLabel(f))+'</button>':'<span class="file-unavailable" title="'+escapeHtml(f.name)+'">'+escapeHtml(formatLabel(f))+' · '+(f.exists?tr('暂不支持预览'):tr('不可访问'))+'</span>';}).join('');
  const records=item.files.map(({file:f})=>'<div class="file-record-entry"><b>'+escapeHtml(f.name)+'</b><span>'+({add:tr('新建记录'),update:tr('修改记录'),write:tr('写入记录'),'script-write':tr('脚本写入分析'),linked:tr('助手提供的文件链接')}[f.kind]||tr('文件记录'))+'</span><code>'+escapeHtml(f.path)+'</code>'+(f.label?tr('<span>交付链接原文：')+escapeHtml(f.label)+'</span>':'')+tr('<span>首次记录 ')+fmt(f.firstAt/1000)+tr(' · 最近记录 ')+fmt(f.lastAt/1000)+'</span></div>').join('');
  return '<article class="file-item"><div class="file-row"><strong class="file-name">'+escapeHtml(item.name)+'</strong><div class="file-formats">'+variants+'</div></div>'+(label?'<div class="file-caption" title="'+escapeHtml(label)+tr('">交付时说明：')+escapeHtml((item.files.length>1?formatLabel(annotated.file)+' · ':'')+label)+'</div>':'')+'<details class="file-record" id="fileRecord'+item.index+'" data-file-path="'+escapeHtml(item.files[0].file.path)+'" '+(fileExpanded.has(key)?'open':'')+tr('><summary aria-label="查看 ')+escapeHtml(item.name)+tr(' 的文件记录">记录</summary><div class="file-record-body">')+records+'</div></details></article>';
 }).join('')+'</section>').join('')+tr('<details class="file-explanation"><summary>文件分组与来源说明</summary><p>按目录和去掉扩展名后的同名分组；目录和条目按首次记录先后排列。不代表内容相同或存在版本、生成关系。说明引用历史交付链接原文，不代表文件当前内容。</p><p>')+escapeHtml(r.note)+'</p></details></section>';
}
async function loadFiles(id,g){const key=g+':'+id;if(fileCache.get(id)?.verifiedGeneration===g||filesPending.has(key))return;filesPending.add(key);try{const r=await call('get_session_files',{id});if(g===generation)fileCache.set(id,{...r,verifiedGeneration:g})}catch(e){if(g===generation)fileCache.set(id,{...(fileCache.get(id)||{}),error:tr('文件记录读取失败：')+e.message,verifiedGeneration:g})}finally{filesPending.delete(key);if(g===generation)render()}}

function summaryControlsHtml(t,label,button,status=''){return '<div class="summary-controls"><div class="summary-action">'+button.replace('id="regenerate"','id="regenerate" aria-describedby="summaryUsage"').replace('</button>',(status?tr(' · 有新内容'):'')+'</button>')+tr('<span id="summaryUsage">AI 生成 · 使用 Codex 额度</span></div><details id="summaryControls" ')+(summaryExpanded.get(t.id)?'open':'')+tr('><summary>生成说明</summary><p>点击按钮后，将本会话最初2轮和最近8轮的消息摘录发送给当前 Codex 登录使用的 OpenAI 模型，生成或更新摘要；不读取项目文件，不包含工具输出。</p></details></div>');}

function overviewHtml(t){
 const r=overviewCache.get(t.id);
 if(!r)return tr('<h3>需求摘录</h3><p>')+escapeHtml(readableExcerpt(t.preview||t.title))+tr('</p><p class="muted">正在读取已有摘要…</p>');
 const snapshot=r.overview?r:r.previous;
 if(snapshot){const hint=r.state==='generating'?tr('正在更新摘要，保留上次结果。'):r.state==='error'?tr('摘要更新失败：')+r.error:'';
  return tr('<h3>任务目标</h3><p>')+escapeHtml(snapshot.overview.goal)+tr('</p><h3>当前进展</h3><p>')+escapeHtml(snapshot.overview.progress)+tr('</p><h3>下一步 / 待确认</h3><p>')+escapeHtml(snapshot.overview.next)+'</p>'+(hint||!r.stale?'<p class="'+(hint?'badge':'muted')+'">'+escapeHtml(hint||tr('已有摘要 · 与当前读取版本一致'))+'</p>':'')+tr('<p class="muted">生成于 ')+fmt(snapshot.generatedAt/1000)+tr(' · 基于会话版本 ')+fmt(snapshot.sourceUpdatedAt)+'</p>'+(r.state==='generating'?'':summaryControlsHtml(t,tr('更新任务摘要'),tr('<button id="regenerate">更新摘要</button>'),r.stale&&r.state!=='error'?tr('会话有新内容'):''));
 }
 if(r.state==='generating')return tr('<h3>任务概览</h3><p>正在生成目标、进展和下一步…</p>');
 if(r.state==='consent_required')return tr('<h3>需求摘录</h3><p>')+escapeHtml(readableExcerpt(r.originalGoal||t.preview||t.title))+'</p>'+summaryControlsHtml(t,tr('生成任务摘要'),tr('<button id="regenerate">生成摘要</button>'));
 return tr('<h3>已有摘要暂不可用</h3><p class="muted">')+escapeHtml(r.error||tr('请重试读取，或在原会话中查看完整记录。'))+'</p>'+summaryControlsHtml(t,tr('重新生成任务摘要'),tr('<button id="regenerate">重新生成摘要</button>'));

async function loadOverview(t,g,force=false,approved=false){const key=g+':'+t.id;if(overviewPending.has(key)||(!force&&overviewCache.has(t.id)&&overviewCache.get(t.id).state!=='generating'&&overviewCache.get(t.id).verifiedGeneration===g))return;overviewPending.add(key);if(force){const old=overviewCache.get(t.id);overviewCache.set(t.id,{state:'generating',previous:old?.overview?old:old?.previous})}try{let r=await call('get_task_overview',{id:t.id,updatedAt:t.updatedAt,force,approved});while(r.state==='generating'&&g===generation&&selected===t.id){overviewCache.set(t.id,{...r,verifiedGeneration:g});await new Promise(resolve=>setTimeout(resolve,3000));r=await call('get_task_overview',{id:t.id,updatedAt:t.updatedAt});}if(g===generation){overviewCache.set(t.id,{...r,verifiedGeneration:g});if(selected===t.id)render()}}catch(e){if(g===generation){overviewCache.set(t.id,{state:'error',error:e.message,previous:overviewCache.get(t.id)?.overview?overviewCache.get(t.id):overviewCache.get(t.id)?.previous,verifiedGeneration:g});if(selected===t.id)render()}}finally{overviewPending.delete(key)}}

function projectHtml(scoped){

 const button=r.state==='generating'?'':'<button id="generateProject">'+(snapshot?tr('同意发送摘录并更新概况'):tr('同意发送项目会话摘录并生成概况'))+'</button>';
 const open=projectExpanded.get(project)?'open':'';
 if(!snapshot)return tr('<h2>项目概况</h2><p>')+escapeHtml(r.state==='generating'?tr('正在综合项目会话…'):r.state==='error'?r.error:tr('尚未生成项目概况'))+'</p><details id="projectDetails" '+open+tr('><summary>查看说明与整理项目概况</summary><p class="muted">')+escapeHtml(r.note||tr('概况综合多个会话，不以最后一条消息代替项目状态。'))+'</p>'+consent+button+'</details>';
 const o=snapshot.overview,sources=snapshot.sources||[];
 const rows=(items,kind)=>items.length?'<ul>'+items.map(x=>'<li>'+escapeHtml(kind==='workstreams'?x.title+'：'+x.progress:x.text)+tr(' <small class="muted">来源 ')+x.sources.map(id=>{const i=sources.findIndex(s=>s.id===id);return i<0?'?':i+1}).join('、')+'</small></li>').join('')+'</ul>':tr('<p class="muted">暂无明确记录</p>');

async function loadProject(id,g,approved=false,force=false){const key=g+':'+id;if(projectPending.has(key)||(!force&&projectCache.has(id)&&projectCache.get(id).state!=='generating'&&projectCache.get(id).verifiedGeneration===g))return;projectPending.add(key);if(force){const old=projectCache.get(id);projectCache.set(id,{state:'generating',previous:old?.overview?old:old?.previous})}try{let r=await call('get_project_overview',{projectId:id,approved,force});while(r.state==='generating'&&g===generation&&project===id){projectCache.set(id,{...r,verifiedGeneration:g});await new Promise(resolve=>setTimeout(resolve,3000));r=await call('get_project_overview',{projectId:id});}if(g===generation){projectCache.set(id,{...r,verifiedGeneration:g});if(project===id)render()}}catch(e){if(g===generation){projectCache.set(id,{state:'error',error:e.message,previous:projectCache.get(id)?.overview?projectCache.get(id):projectCache.get(id)?.previous,verifiedGeneration:g});if(project===id)render()}}finally{projectPending.delete(key)}}

function cardSummary(t){const value=overviewCache.get(t.id);const snapshot=value?.overview?value:value?.previous;if(snapshot?.overview){if(t.summary&&(t.summary.sourceUpdatedAt>(snapshot.sourceUpdatedAt||0)||t.summary.generatedAt>(snapshot.generatedAt||0)))return t.summary;return {...snapshot.overview,stale:!!value.stale||snapshot.sourceUpdatedAt!==t.updatedAt,generatedAt:snapshot.generatedAt};}return t.summary||null;}
function readableExcerpt(value){let text=String(value||'');if(/^(?:#?\s*Context from my IDE setup:|Files mentioned by the user:)/i.test(text)&&text.includes('My request:'))text=text.slice(text.lastIndexOf('My request:')+11);return text.replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/codex:\/\/threads\/[\w-]+/g,'参考会话').replace(/https?:\/\/\S+/g,'相关链接').replace(/^#+\s*/gm,'').replace(/\*\*|`/g,'').trim();}
function brief(text,max=96){const normalized=readableExcerpt(text).replace(/\s+/g,' ').trim();return normalized.length>max?normalized.slice(0,max)+'…':normalized;}
function cardHtml(t,pr){const summary=cardSummary(t);const goal=summary?.goal||t.preview||t.title,status=summary?(summary.stale?tr('摘要待更新'):tr('已有摘要')):tr('原始摘录');return '<h3>'+escapeHtml(t.title)+'</h3><p class="card-goal">'+escapeHtml(brief(goal))+'</p><p class="card-progress">'+(summary?tr('进展：'):tr('近况摘录：'))+escapeHtml(brief(summary?.progress||pr?.text||tr('正在读取最近回复…')))+'</p><div class="session-meta"><span>'+(!project?escapeHtml(t.project==='unassigned'?tr('未归类'):t.projectName)+' · ':'')+shortTime(t.updatedAt)+'</span><span class="card-state '+(summary?.stale?'stale':'')+'">'+status+'</span></div>';}
async function checkVersion(){const button=$('checkVersion');button.disabled=true;try{const r=await call('get_workbench_status',{uiVersion:UI_VERSION});$('versionStatus').textContent=tr('界面 v')+UI_VERSION+tr(' · 服务 v')+r.serviceVersion+(r.versionsMatch?tr('（一致）'):tr('（不一致，请重新加载）'));$('versionWarning').textContent=r.versionsMatch?'':tr('工作台界面与服务版本不一致。刷新数据不会升级页面，请完全退出 Codex 后重新打开。');}catch(e){$('versionStatus').textContent=tr('界面 v')+UI_VERSION+tr(' · 服务版本检查失败：')+e.message;}finally{button.disabled=false}}
$('checkVersion').onclick=checkVersion;

async function openArtifact(id,file){const control=$('previewFile'+(fileCache.get(id)?.files||[]).indexOf(file));if(control)control.disabled=true;if(id===selected)$('detailMessage').textContent=tr('正在打开 ')+file.name+'…';try{let r;if(file.previewKind==='native')r=await rpc('openai/files/open',{path:file.path});else{const p=await rpc('tools/call',{name:'open_preview_tab',arguments:{id,path:file.path}});if(p.isError)throw Error(p.content?.find(c=>c.type==='text')?.text||tr('无法准备文件预览'));if(!p._meta?.openUrl)throw Error(tr('宿主未返回标签页地址，请检查界面与服务版本'));r=await rpc('ui/open-link',{url:p._meta.openUrl});}if(r?.isError)throw Error(tr('Codex 拒绝打开标签页'));if(id===selected)$('detailMessage').textContent='';}catch(e){const text=tr('打开预览标签页失败：')+e.message;if(id===selected)$('detailMessage').textContent=text;else $('message').textContent=text;}finally{if(control?.isConnected)control.disabled=false;}}

async function setupOnboarding(){
 const box=$('onboarding');
 try{const state=await call('workbench_onboarding');setLanguagePreference(state.language||'auto');if(state.decision||!threads.length)return;
 const t=[...threads].sort((a,b)=>b.updatedAt-a.updatedAt)[0],p=declaredProjects.find(p=>p.id===t.project);
 setHtml(box,tr('<h2>先体验一次 AI 摘要</h2><p>为最近会话「')+escapeHtml(t.title)+'」'+(p?tr('及所属项目「')+escapeHtml(p.id==='unassigned'?tr('未归类'):p.name)+'」':'')+tr('生成摘要。已有有效摘要直接复用。</p><p class="muted">会将部分会话消息发送给 OpenAI 模型，使用 Codex 额度。其他摘要由你主动生成。</p><button class="action" id="startExperience">生成并体验</button> <button class="quiet" id="skipExperience">暂时跳过</button><p id="experienceStatus" role="status"></p>'));box.hidden=false;
 $('skipExperience').onclick=async()=>{try{await call('workbench_onboarding',{action:'skip'});box.hidden=true}catch(e){$('experienceStatus').textContent=e.message}};
 $('startExperience').onclick=async()=>{
 $('startExperience').disabled=true;$('startExperience').textContent=tr('正在生成…');$('skipExperience').textContent=tr('收起引导');$('skipExperience').onclick=()=>{box.hidden=true};
 try{await call('workbench_onboarding',{action:'accept'});project=p?.id||'';selected=t.id;mobileDetail=innerWidth<=800;render();const g=generation;
 const run=async(kind,args)=>{let r=await call(kind,args);while(r.state==='generating'){await new Promise(resolve=>setTimeout(resolve,3000));r=await call(kind,kind==='get_task_overview'?{id:t.id,updatedAt:t.updatedAt}:{projectId:p.id})}return r};
 $('experienceStatus').textContent=tr('正在生成会话摘要，可继续浏览…');
 const task=await run('get_task_overview',{id:t.id,updatedAt:t.updatedAt,approved:true});overviewCache.set(t.id,{...task,verifiedGeneration:g});render();
 let pr=null;if(p){$('experienceStatus').textContent=tr('会话已处理，正在生成项目概况…');pr=await run('get_project_overview',{projectId:p.id,approved:true});projectCache.set(p.id,{...pr,verifiedGeneration:g});render()}
 $('experienceStatus').textContent=(task.state==='ready'||task.overview)&&(!p||pr?.overview)?tr('摘要已就绪。其他摘要可按需生成。'):tr('部分摘要未完成，请在对应摘要区域重试；已有结果已保留。');
 }catch(e){$('experienceStatus').textContent=tr('体验未完成：')+e.message+tr('。已有结果保留，可在摘要区域重试。')}finally{$('startExperience').hidden=true;$('skipExperience').textContent=tr('关闭引导');}
 };
 }catch(e){box.hidden=false;box.textContent=tr('首次体验引导暂不可用：')+e.message;}
}
